<!DOCTYPE html>
<html lang="ja">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
  >

  <title>ガールズ競輪予想</title>


  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans JP",
        "Yu Gothic",
        "Hiragino Kaku Gothic ProN",
        Meiryo,
        sans-serif;
      background: #ffffff;
      color: #111111;
    }


    body {
      min-height: 100vh;
      overflow-x: hidden;
    }


    button {
      font-family: inherit;
    }


    /* ========================================
       全体
    ======================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }


    /* ========================================
       ヘッダー
    ======================================== */

    .header {
      width: 100%;
      padding: 28px 20px 22px;
      background: #ffffff;
      border-bottom: 5px solid #d82c78;
      text-align: center;
    }


    .main-title {
      margin: 0;
      color: #d82c78;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -1px;
      white-space: nowrap;
    }


    .sub-title {
      margin-top: 8px;
      color: #111111;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }


    /* ========================================
       メニュー
    ======================================== */

    .menu {
      width: 100%;
      padding: 28px 18px 0;
    }


    .menu-item {
      width: 100%;
      min-height: 106px;
      margin: 0 0 18px;
      padding: 0;
      display: flex;
      align-items: stretch;
      border: 2px solid #eeeeee;
      border-radius: 24px;
      background: #ffffff;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      appearance: none;
      cursor: pointer;
      text-align: left;
    }


    .menu-item:active {
      transform: scale(0.99);
    }


    /* ========================================
       アイコン部分
    ======================================== */

    .menu-icon {
      width: 125px;
      min-width: 125px;
      min-height: 106px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* カレンダー */

    .calendar-icon {
      background: #fff2f7;
    }


    .calendar-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 62px;
      border: 7px solid #d82c78;
      border-radius: 9px;
    }


    .calendar-icon::after {
      content: "";
      position: absolute;
      width: 82px;
      height: 14px;
      top: 38px;
      border-top: 7px solid #d82c78;
    }


    .calendar-icon span {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #d82c78;
      z-index: 2;
    }


    .calendar-icon span:nth-child(1) {
      left: 35px;
      top: 52px;
    }


    .calendar-icon span:nth-child(2) {
      left: 56px;
      top: 52px;
    }


    .calendar-icon span:nth-child(3) {
      left: 77px;
      top: 52px;
    }


    .calendar-icon span:nth-child(4) {
      left: 35px;
      top: 71px;
    }


    /* ========================================
       王冠
    ======================================== */

    .crown-icon {
      background: #fff2f7;
      color: #8127c7;
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       グラフ
    ======================================== */

    .chart-icon {
      background: #fff2f7;
    }


    .chart-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 64px;
      border: 7px solid #d82c78;
      border-radius: 8px;
    }


    .bar {
      position: absolute;
      bottom: 25px;
      width: 9px;
      background: #d82c78;
      z-index: 2;
    }


    .bar1 {
      height: 18px;
      left: 35px;
    }


    .bar2 {
      height: 35px;
      left: 51px;
    }


    .bar3 {
      height: 51px;
      left: 67px;
    }


    .chart-arrow {
      position: absolute;
      left: 63px;
      top: 20px;
      z-index: 3;
      color: #d82c78;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       テキスト
    ======================================== */

    .menu-text {
      flex: 1;
      min-width: 0;
      padding: 22px 4px 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    .menu-title {
      color: #111111;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.4;
      white-space: nowrap;
    }


    .menu-description {
      margin-top: 7px;
      color: #777777;
      font-size: 13px;
      line-height: 1.45;
      white-space: nowrap;
    }


    /* ========================================
       右矢印
    ======================================== */

    .arrow {
      width: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d82c78;
      font-size: 50px;
      font-weight: 300;
      line-height: 1;
    }


    /* ========================================
       下部ビジュアル
    ======================================== */

    .visual-area {
      width: 100%;
      height: 300px;
      position: relative;
      overflow: hidden;
      margin-top: 2px;
      background:
        linear-gradient(
          180deg,
          #ffffff 0%,
          #fff8fb 45%,
          #ffe8f2 100%
        );
    }


    /* バンク風のライン */

    .visual-area::before {
      content: "";
      position: absolute;
      width: 150%;
      height: 120px;
      left: -20%;
      bottom: 20px;
      border-top: 7px solid rgba(216, 44, 120, 0.10);
      border-bottom: 7px solid rgba(216, 44, 120, 0.08);
      transform: rotate(-12deg);
    }


    .visual-area::after {
      content: "";
      position: absolute;
      width: 150%;
      height: 8px;
      left: -20%;
      bottom: 76px;
      background: rgba(255, 255, 255, 0.75);
      transform: rotate(-12deg);
    }


    /* ========================================
       キャッチコピー
    ======================================== */

    .catch-copy {
      position: absolute;
      left: 25px;
      top: 72px;
      z-index: 5;
      color: #d82c78;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.55;
    }


    .catch-line {
      width: 70px;
      height: 4px;
      margin-top: 14px;
      background: #d82c78;
      border-radius: 2px;
    }


    /* ========================================
       自転車
    ======================================== */

    .bike {
      position: absolute;
      width: 330px;
      height: 220px;
      right: -45px;
      bottom: 0;
      z-index: 4;
      opacity: 0.16;
    }


    .bike-wheel {
      position: absolute;
      width: 105px;
      height: 105px;
      bottom: 14px;
      border: 6px solid #d82c78;
      border-radius: 50%;
    }


    .wheel-left {
      left: 25px;
    }


    .wheel-right {
      right: 15px;
    }


    .bike-frame {
      position: absolute;
      width: 125px;
      height: 6px;
      left: 80px;
      bottom: 65px;
      background: #d82c78;
      transform: rotate(-24deg);
      transform-origin: left center;
      border-radius: 4px;
    }


    .frame2 {
      width: 120px;
      left: 125px;
      bottom: 65px;
      transform: rotate(26deg);
    }


    .frame3 {
      width: 100px;
      left: 83px;
      bottom: 65px;
      transform: rotate(0deg);
    }


    .bike-rider {
      position: absolute;
      width: 90px;
      height: 9px;
      left: 137px;
      bottom: 122px;
      background: #d82c78;
      transform: rotate(-15deg);
      border-radius: 10px;
    }


    /* ========================================
       LINEに戻る
    ======================================== */

    .line-back-button {
      display: block;
      width: calc(100% - 36px);
      min-height: 70px;
      margin: 26px 18px 28px;
      border: 3px solid #d82c78;
      border-radius: 22px;
      background: #ffffff;
      color: #d82c78;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      appearance: none;
    }


    .line-back-button:active {
      transform: scale(0.99);
    }


    /* ========================================
       小さいスマホ
    ======================================== */

    @media (max-width: 380px) {

      .header {
        padding: 24px 14px 20px;
      }


      .main-title {
        font-size: 28px;
      }


      .sub-title {
        font-size: 17px;
      }


      .menu {
        padding-left: 14px;
        padding-right: 14px;
      }


      .menu-item {
        min-height: 100px;
        margin-bottom: 16px;
      }


      .menu-icon {
        width: 108px;
        min-width: 108px;
        min-height: 100px;
      }


      .calendar-icon::before {
        width: 76px;
        height: 58px;
      }


      .calendar-icon::after {
        width: 76px;
      }


      .calendar-icon span:nth-child(1) {
        left: 29px;
      }


      .calendar-icon span:nth-child(2) {
        left: 48px;
      }


      .calendar-icon span:nth-child(3) {
        left: 67px;
      }


      .calendar-icon span:nth-child(4) {
        left: 29px;
      }


      .menu-text {
        padding-left: 8px;
      }


      .menu-title {
        font-size: 19px;
      }


      .menu-description {
        font-size: 11px;
      }


      .arrow {
        width: 42px;
        min-width: 42px;
      }


      .catch-copy {
        left: 20px;
        top: 65px;
        font-size: 20px;
      }


      .bike {
        right: -95px;
        transform: scale(0.9);
        transform-origin: bottom right;
      }


      .line-back-button {
        width: calc(100% - 28px);
        margin-left: 14px;
        margin-right: 14px;
        font-size: 19px;
      }

    }

/* ========================================
   下部ビジュアル画像
======================================== */

.visual-area {
  width: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #ffffff;
  line-height: 0;
}

.visual-image {
  display: block;
  width: 100%;
  height: auto;
  margin: 0;
  padding: 0;
}
    
  </style>

</head>


<body>

  <div class="app">


    <!-- ======================================
         ヘッダー
    ======================================= -->

    <header class="header">

      <div class="main-title">
        ガールズ競輪予想
      </div>

      <div class="sub-title">
        DOKOTOクラブ立川
      </div>

    </header>


    <!-- ======================================
         メニュー
    ======================================= -->

    <main class="menu">


      <!-- 予想スケジュール -->

      <button
        class="menu-item"
        onclick="openSchedule()"
      >

        <div class="menu-icon calendar-icon">

          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>


        <div class="menu-text">

          <div class="menu-title">
            予想スケジュール
          </div>

          <div class="menu-description">
            開催日程・予想レースを確認できます
          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      </button>



      <!-- 現在開催中の情報 -->

      <button
        class="menu-item"
        onclick="openCurrent()"
      >

        <div class="menu-icon calendar-icon">

          <span></span>
          <span></span>
          <span></span>
          <span></span>

        </div>


        <div class="menu-text">

          <div class="menu-title">
            現在開催中の情報
          </div>

          <div class="menu-description">
            今開催の注目選手・当日予想一覧はこちら
          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      </button>



      <!-- 本日の予想 -->

      <button
        class="menu-item"
        onclick="openToday()"
      >

        <div class="menu-icon crown-icon">
          ♛
        </div>


        <div class="menu-text">

          <div class="menu-title">
            本日の予想
          </div>

          <div class="menu-description">
            本日のレース予想をまとめてご覧いただけます
          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      </button>



      <!-- 予想実績 -->

      <button
        class="menu-item"
        onclick="openResults()"
      >

        <div class="menu-icon chart-icon">

          <div class="bar bar1"></div>
          <div class="bar bar2"></div>
          <div class="bar bar3"></div>

          <div class="chart-arrow">
            ↗
          </div>

        </div>


        <div class="menu-text">

          <div class="menu-title">
            予想実績
          </div>

          <div class="menu-description">
            これまでの予想結果を確認できます
          </div>

        </div>


        <div class="arrow">
          ›
        </div>

      </button>


    </main>



    <!-- ======================================
         下部ビジュアル
    ======================================= -->
<!-- 下部ビジュアル -->
<div class="visual-area">

  <img
    src="df5f0591-4f17-42fb-adf6-fe84040dd90e.png"
    alt="競輪をもっと楽しく、もっと身近に。"
    class="visual-image"
  >

</div>
   


    <!-- ======================================
         LINEに戻る
    ======================================= -->

    <button
      class="line-back-button"
      onclick="closePage()"
    >
      ← LINEに戻る
    </button>


  </div>



  <script>

    /*
     * LINEへ戻る
     *
     * 現在はGitHub Pagesでの確認段階。
     * LIFF接続後にLINE内で閉じる処理を追加します。
     */

    function closePage() {

      if (
        typeof liff !== "undefined" &&
        typeof liff.closeWindow === "function"
      ) {

        try {

          liff.closeWindow();

          return;

        } catch (error) {

          console.log(error);

        }

      }


      if (window.history.length > 1) {

        window.history.back();

        return;

      }


      window.close();

    }



    /*
     * 次の工程で各ページへ変更します
     */

    function openSchedule() {

      alert(
        "予想スケジュールは次の工程で作成します。"
      );

    }


    function openCurrent() {

      alert(
        "現在開催中の情報は次の工程で作成します。"
      );

    }


    function openToday() {

      alert(
        "本日の予想は次の工程で作成します。"
      );

    }


    function openResults() {

      alert(
        "予想実績は次の工程で作成します。"
      );

    }

  </script>


</body>
</html>
