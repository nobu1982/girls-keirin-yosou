    }

    body {

        "Hiragino Kaku Gothic ProN",

      background: #ffffff;
      color: #111111;
    }


    body {
      min-height: 100vh;
      overflow-x: hidden;
    }


    button {
      font-family: inherit;
    }


    /* ========================================
       全体
    ======================================== */

    .app {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      overflow: hidden;
    }


    /* ========================================
       ヘッダー
    ======================================== */

    .header {
      width: 100%;
      padding: 28px 20px 22px;
      background: #ffffff;
      border-bottom: 5px solid #d82c78;
      text-align: center;
    }


    .main-title {
      margin: 0;
      color: #d82c78;
      font-size: 32px;
      font-weight: 800;
      line-height: 1.3;
      letter-spacing: -1px;
      white-space: nowrap;
    }


    .sub-title {
      margin-top: 8px;
      color: #111111;
      font-size: 18px;
      font-weight: 600;
      line-height: 1.3;
    }


    /* ========================================
       メニュー
    ======================================== */

    .menu {
      width: 100%;
      padding: 28px 18px 0;
    }


    .menu-item {
      width: 100%;
      min-height: 106px;
      margin: 0 0 18px;
      padding: 0;
      display: flex;
      align-items: stretch;
      border: 2px solid #eeeeee;
      border-radius: 24px;
      background: #ffffff;
      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.08);
      overflow: hidden;
      appearance: none;
      cursor: pointer;
      text-align: left;
    }


    .menu-item:active {
      transform: scale(0.99);
    }


    /* ========================================
       アイコン部分
    ======================================== */

    .menu-icon {
      width: 125px;
      min-width: 125px;
      min-height: 106px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }


    /* カレンダー */

    .calendar-icon {
      background: #fff2f7;
    }


    .calendar-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 62px;
      border: 7px solid #d82c78;
      border-radius: 9px;
    }


    .calendar-icon::after {
      content: "";
      position: absolute;
      width: 82px;
      height: 14px;
      top: 38px;
      border-top: 7px solid #d82c78;
    }


    .calendar-icon span {
      position: absolute;
      width: 10px;
      height: 10px;
      background: #d82c78;
      z-index: 2;
    }


    .calendar-icon span:nth-child(1) {
      left: 35px;
      top: 52px;
    }


    .calendar-icon span:nth-child(2) {
      left: 56px;
      top: 52px;
    }


    .calendar-icon span:nth-child(3) {
      left: 77px;
      top: 52px;
    }


    .calendar-icon span:nth-child(4) {
      left: 35px;
      top: 71px;
    }


    /* ========================================
       王冠
    ======================================== */

    .crown-icon {
      background: #fff2f7;
      color: #8127c7;
      font-size: 58px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       グラフ
    ======================================== */

    .chart-icon {
      background: #fff2f7;
    }


    .chart-icon::before {
      content: "";
      position: absolute;
      width: 82px;
      height: 64px;
      border: 7px solid #d82c78;
      border-radius: 8px;
    }


    .bar {
      position: absolute;
      bottom: 25px;
      width: 9px;
      background: #d82c78;
      z-index: 2;
    }


    .bar1 {
      height: 18px;
      left: 35px;
    }


    .bar2 {
      height: 35px;
      left: 51px;
    }


    .bar3 {
      height: 51px;
      left: 67px;
    }


    .chart-arrow {
      position: absolute;
      left: 63px;
      top: 20px;
      z-index: 3;
      color: #d82c78;
      font-size: 36px;
      font-weight: 900;
      line-height: 1;
    }


    /* ========================================
       テキスト
    ======================================== */

    .menu-text {
      flex: 1;
      min-width: 0;
      padding: 22px 4px 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }


    .menu-title {
      color: #111111;
      font-size: 21px;
      font-weight: 800;
      line-height: 1.4;
      white-space: nowrap;
    }


    .menu-description {
      margin-top: 7px;
      color: #777777;
      font-size: 13px;
      line-height: 1.45;
      white-space: nowrap;
    }


    /* ========================================
       右矢印
    ======================================== */

    .arrow {
      width: 48px;
      min-width: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #d82c78;
      font-size: 50px;
      font-weight: 300;
      line-height: 1;
    }


   
    /* ========================================
       キャッチコピー
    ======================================== */

    .catch-copy {
      position: absolute;
      left: 25px;
      top: 72px;
      z-index: 5;
      color: #d82c78;
      font-size: 23px;
      font-weight: 800;
      line-height: 1.55;
    }


    .catch-line {
      width: 70px;
      height: 4px;
      margin-top: 14px;
      background: #d82c78;
      border-radius: 2px;
    }


    /* ========================================
       自転車
    ======================================== */

    .bike {
      position: absolute;
      width: 330px;
      height: 220px;
      right: -45px;
      bottom: 0;
      z-index: 4;
      opacity: 0.16;
    }


    .bike-wheel {
      position: absolute;
      width: 105px;
      height: 105px;
      bottom: 14px;
      border: 6px solid #d82c78;
      border-radius: 50%;
    }


    .wheel-left {
      left: 25px;
    }


    .wheel-right {
      right: 15px;
    }


    .bike-frame {
      position: absolute;
      width: 125px;
      height: 6px;
      left: 80px;
      bottom: 65px;
      background: #d82c78;
      transform: rotate(-24deg);
      transform-origin: left center;
      border-radius: 4px;
    }


    .frame2 {
      width: 120px;
      left: 125px;
      bottom: 65px;
      transform: rotate(26deg);
    }


    .frame3 {
      width: 100px;
      left: 83px;
      bottom: 65px;
      transform: rotate(0deg);
    }


    .bike-rider {
      position: absolute;
      width: 90px;
      height: 9px;
      left: 137px;
      bottom: 122px;
      background: #d82c78;
      transform: rotate(-15deg);
      border-radius: 10px;
    }


    /* ========================================
       LINEに戻る
    ======================================== */

    .line-back-button {
      display: block;
      width: calc(100% - 36px);
      min-height: 70px;
      margin: 26px 18px 28px;
      border: 3px solid #d82c78;
      border-radius: 22px;
      background: #ffffff;
      color: #d82c78;
      font-size: 21px;
      font-weight: 800;
      cursor: pointer;
      appearance: none;
    }


    .line-back-button:active {
      transform: scale(0.99);
    }


    /* ========================================
       小さいスマホ
    ======================================== */

    @media (max-width: 380px) {

      .header {
        padding: 24px 14px 20px;
      }


      .main-title {
        font-size: 28px;
      }


      .sub-title {
        font-size: 17px;
      }


      .menu {
        padding-left: 14px;
        padding-right: 14px;
      }


      .menu-item {
        min-height: 100px;
        margin-bottom: 16px;
      }


      .menu-icon {
        width: 108px;
        min-width: 108px;
        min-height: 100px;
      }


      .calendar-icon::before {
        width: 76px;
        height: 58px;
      }


      .calendar-icon::after {
        width: 76px;
      }


      .calendar-icon span:nth-child(1) {
        left: 29px;
      }


      .calendar-icon span:nth-child(2) {
        left: 48px;
      }


      .calendar-icon span:nth-child(3) {
        left: 67px;
      }


      .calendar-icon span:nth-child(4) {
        left: 29px;
      }


      .menu-text {
        padding-left: 8px;
      }


      .menu-title {
        font-size: 19px;
      }


      .menu-description {
        font-size: 11px;
      }


      .arrow {
        width: 42px;
        min-width: 42px;
      }


      .catch-copy {
        left: 20px;
        top: 65px;
        font-size: 20px;
      }


      .bike {
        right: -95px;
        transform: scale(0.9);
        transform-origin: bottom right;
      }


      .line-back-button {
        width: calc(100% - 28px);
        margin-left: 14px;
        margin-right: 14px;
        font-size: 19px;
      }

    }

  <div class="app">

    <div id="topPage">


    <!-- ======================================
         ヘッダー

  <section id="schedulePage" class="page">

    <header class="schedule-page-header">

    <main class="detail-content">

      </section>

      ← トップに戻る

  </section>



  <script>

    /*
     * LINEへ戻る
     *
     * 現在はGitHub Pagesでの確認段階。
     * LIFF接続後にLINE内で閉じる処理を追加します。
     */

    function closePage() {

      if (
        typeof liff !== "undefined" &&
        typeof liff.closeWindow === "function"
      ) {

        try {

          liff.closeWindow();

          return;

        } catch (error) {

          console.log(error);

        }

      }


      if (window.history.length > 1) {

        window.history.back();

        return;

      }


      window.close();

    }



    /*
     * ========================================
     * 予想スケジュール
     * ========================================
     */

    const GAS_API_URL =
      "https://script.google.com/macros/s/AKfycbzZhfQBFKpKPeBK5Ue6Zc4eBIMIEr0eUtYyTIiPVMX4NVJV-l9V7EqouFq_U0ljNWMfLg/exec";


    window.scheduleData = [];
    window.dailyPredictionsData = [];


    function openSchedule() {

      document.getElementById("topPage").style.display = "none";
      document.getElementById("schedulePage").classList.add("active");

      window.scrollTo(0, 0);

      loadSchedule();

    }


    function formatJapaneseDate(dateText, weekday) {

      const parts = String(dateText || "").split("-");

      if (parts.length !== 3) {
        return dateText + "（" + weekday + "）";
      }

      const month = Number(parts[1]);
      const day = Number(parts[2]);

      return month + "月" + day + "日（" + weekday + "）";

    }


    function renderFeaturedRiders(scheduleId) {

      const list =
        document.getElementById("featuredList");

      const riders =
        (window.featuredRidersData || [])
          .filter(function(rider) {
            return String(rider.scheduleId) === String(scheduleId);
          });

      if (!riders.length) {
        list.innerHTML =
          '<div class="featured-empty">' +
          '現在、注目選手の情報はありません。' +
          '</div>';
        return;
      }

      list.innerHTML =
        riders.map(function(rider) {
          return (
            '<div class="featured-card">' +
              '<div class="featured-rider-name">' +
                escapeHtml(rider.riderName || rider.name || "") +
              '</div>' +
              '<div class="featured-rider-comment">' +
                escapeHtml(rider.comment) +
              '</div>' +
            '</div>'
          );
        }).join("");

    }


    function backToTop() {

      document.getElementById("schedulePage").classList.remove("active");
      document.getElementById("topPage").style.display = "block";

      window.scrollTo(0, 0);

    }


    function loadSchedule() {

      const list =
        document.getElementById("scheduleList");

      list.innerHTML =
        '<div class="schedule-message">読み込み中です…</div>';


      const callbackName =
        "scheduleCallback_" + Date.now();


      window[callbackName] =
        function(response) {

          try {

            if (
              !response ||
              response.success !== true
            ) {

              throw new Error(
                response && response.error
                  ? response.error
                  : "データ取得に失敗しました。"
              );

            }

            window.featuredRidersData =
              response.featuredRiders || [];

            /*
             * 日別予想
             *
             * GASから返ってきた日別予想を保存します。
             * API側の項目名が predictions / dailyPredictions
             * のどちらでも受け取れるようにしています。
             */
            window.dailyPredictionsData =
              response.dailyPredictions ||
              response.predictions ||
              [];

            renderSchedule(
              response.schedules || []
            );

          } catch (error) {

            console.error(error);

            list.innerHTML =
              '<div class="schedule-message">' +
              'スケジュールを取得できませんでした。' +
              '<br>時間をおいて再度お試しください。' +
              '</div>';

          } finally {

            cleanup();

          }

        };


      const script =
        document.createElement("script");


      script.src =
        GAS_API_URL +
        "?callback=" +
        encodeURIComponent(callbackName);


      script.onerror =
        function() {

          list.innerHTML =
            '<div class="schedule-message">' +
            'スケジュールを取得できませんでした。' +
            '<br>時間をおいて再度お試しください。' +
            '</div>';

          cleanup();

        };


      document.body.appendChild(script);


      function cleanup() {

        delete window[callbackName];

        if (script.parentNode) {
          script.parentNode.removeChild(script);
        }

      }

    }


    function renderSchedule(schedules) {

      window.scheduleData = schedules || [];

      const list =
        document.getElementById("scheduleList");


      if (!schedules.length) {

        list.innerHTML =
          '<div class="schedule-message">' +
          '現在公開されている開催はありません。' +
          '</div>';

        return;

      }


      list.innerHTML =
        schedules.map(function(item) {

          const dateText =
            escapeHtml(item.startText) +
            "～" +
            escapeHtml(item.endText);


          const weekdayText =
            "(" +
            escapeHtml(item.startWeekday) +
            ")～(" +
            escapeHtml(item.endWeekday) +
            ")";


          return (
            '<button class="schedule-card" type="button" ' +
              'onclick="openScheduleDetail(\'' +
                escapeJs(item.id) +
              '\')">' +

              '<div class="schedule-date">' +
                '<div class="schedule-date-main">' +
                  dateText +
                '</div>' +
                '<div class="schedule-date-week">' +
                  weekdayText +
                '</div>' +
              '</div>' +

              '<div class="schedule-name">' +
                escapeHtml(item.venueText) +
              '</div>' +

              '<div class="schedule-arrow">›</div>' +

            '</button>'
          );

        }).join("");

    }


    function openScheduleDetail(scheduleId) {

      const schedule =
        window.scheduleData.find(function(item) {

          return String(item.id) === String(scheduleId);

        });


      if (!schedule) {

        alert(
          "開催情報を取得できませんでした。"
        );

        return;

      }


      /*
       * ここは元々正常に動いていた処理を維持します。
       * トップ画面を含む .app を隠して、
       * 開催詳細画面を表示します。
       */

      document.querySelector(".app").style.display = "none";

      document.getElementById("schedulePage").classList.remove("active");

      document.getElementById("detailPage").classList.add("active");


      document.getElementById("detailHeaderTitle").textContent =
        schedule.venueText;


      document.getElementById("detailHeaderPeriod").textContent =
        formatJapaneseDate(schedule.startDate, schedule.startWeekday) +
        "～" +
        formatJapaneseDate(schedule.endDate, schedule.endWeekday) +
        " 開催";


      renderFeaturedRiders(schedule.id);

      /*
       * 当日予想一覧を表示
       */
      renderDailyPredictions(schedule);

      window.scrollTo(0, 0);

    }


    /*
     * 開催詳細 → トップ
     */

    function backToTop() {

      document.getElementById("detailPage").classList.remove("active");

      document.getElementById("schedulePage").classList.remove("active");

      document.querySelector(".app").style.display = "block";

      document.getElementById("topPage").style.display = "block";

      window.scrollTo(0, 0);

    }



    /*
     * ========================================
     * 当日予想一覧
     * ========================================
     */

    function renderDailyPredictions(schedule) {

      const note =
        document.getElementById("predictionDateNote");

      const list =
        document.getElementById("predictionList");

      if (!note || !list) {
        return;
      }

      const today = getTodayInJapan();

      /*
       * 開催期間内なら今日の日付、
       * 期間外なら開催初日を表示対象にします。
       */
      let targetDate = today;

      if (today < schedule.startDate) {
        targetDate = schedule.startDate;
      }

      if (today > schedule.endDate) {
        targetDate = schedule.endDate;
      }

      const targetDateObj = new Date(targetDate + "T00:00:00");
      const targetWeekday =
        getJapaneseWeekdayFromDate(targetDateObj);

      const dateLabel =
        formatFullJapaneseDate(targetDate, targetWeekday);

      note.textContent =
        "※ 表示は" + dateLabel + "の予想です。";

      const predictions =
        (window.dailyPredictionsData || [])
          .filter(function(item) {

            const itemScheduleId =
              String(
                item.scheduleId ??
                item.id ??
                ""
              ).trim().padStart(3, "0");

            const targetScheduleId =
              String(schedule.id)
                .trim().padStart(3, "0");

            const itemDate =
              normalizeDateString(
                item.predictionDate ??
                item.date ??
                item.yosobi ??
                ""
              );

            return (
              itemScheduleId === targetScheduleId &&
              itemDate === targetDate
            );

          })
          .sort(function(a, b) {

            return Number(a.raceNumber ?? a.raceNo ?? 0) -
                   Number(b.raceNumber ?? b.raceNo ?? 0);

          });

      if (!predictions.length) {

        list.innerHTML =
          '<div class="prediction-empty">' +
          'この日の予想はまだ公開されていません。' +
          '</div>';

        return;
      }

      list.innerHTML =
        predictions.map(function(item) {

          const raceNumber =
            item.raceNumber ??
            item.raceNo ??
            item.race ??
            "";

          const raceName =
            item.raceName ??
            "";

          const startTime =
            item.startTime ??
            item.time ??
            "";

          const url =
            item.startListUrl ??
            item.raceUrl ??
            item.url ??
            "";

          return (
            '<div class="prediction-card">' +

              '<div class="prediction-race">' +
                escapeHtml(raceNumber) + 'R' +
              '</div>' +

              '<div class="prediction-info">' +

                '<div class="prediction-name">' +
                  escapeHtml(raceName) +
                '</div>' +

                '<div class="prediction-time">' +
                  (startTime
                    ? '発走 ' + escapeHtml(startTime)
                    : '') +
                '</div>' +

              '</div>' +

              '<button ' +
                'class="prediction-button" ' +
                'type="button" ' +
                'onclick="openPredictionDetail(' +
                  '\'' + escapeJs(JSON.stringify({
                    scheduleId: schedule.id,
                    predictionDate: targetDate,
                    raceNumber: raceNumber
                  })) + '\'' +
                ')">' +
                '予想を見る ›' +
              '</button>' +

            '</div>'
          );

        }).join("");

    }


    function openPredictionDetail(dataText) {

      /*
       * 次の工程で予想詳細画面を作成します。
       * 今はボタンの動作確認用です。
       */
      try {

        const data =
          JSON.parse(dataText);

        console.log(
          "予想詳細",
          data
        );

        alert(
          "予想詳細画面は次の工程で作成します。"
        );

      } catch (error) {

        console.error(error);

      }

    }


    function getTodayInJapan() {

      const now = new Date();

      const y =
        now.getFullYear();

      const m =
        String(now.getMonth() + 1)
          .padStart(2, "0");

      const d =
        String(now.getDate())
          .padStart(2, "0");

      return y + "-" + m + "-" + d;

    }


    function normalizeDateString(value) {

      if (!value) {
        return "";
      }

      const text =
        String(value).trim();

      if (/^\d{4}-\d{2}-\d{2}$/.test(text)) {
        return text;
      }

      const match =
        text.match(
          /(\d{4})[\/\-](\d{1,2})[\/\-](\d{1,2})/
        );

      if (!match) {
        return "";
      }

      return (
        match[1] + "-" +
        String(match[2]).padStart(2, "0") + "-" +
        String(match[3]).padStart(2, "0")
      );

    }


    function getJapaneseWeekdayFromDate(date) {

      const weekdays = [
        "日",
        "月",
        "火",
        "水",
        "木",
        "金",
        "土"
      ];

      return weekdays[date.getDay()];

    }


    function formatFullJapaneseDate(
      dateText,
      weekday
    ) {

      const parts =
        String(dateText || "").split("-");

      if (parts.length !== 3) {
        return dateText + "（" + weekday + "）";
      }

      return (
        Number(parts[1]) +
        "月" +
        Number(parts[2]) +
        "日（" +
        weekday +
        "）"
      );

    }


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function escapeJs(value) {

      return String(value || "")
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'");

    }


    function openCurrent() {

      alert(
        "現在開催中の情報は次の工程で作成します。"
      );

    }


    function openToday() {

      alert(
        "本日の予想は次の工程で作成します。"
      );

    }


    function openResults() {

      alert(
        "予想実績は次の工程で作成します。"
      );

    }

  </script>
